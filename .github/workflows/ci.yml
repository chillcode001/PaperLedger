name: ci
on:
  push: { branches-ignore: [ main ] }
  pull_request: { branches: [ main ] }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout the code
        uses: actions/checkout@v4
      - name: setup java
        uses: actions/setup-java@v6
        with: { distribution: "temurin", java-version: "17", cache: "maven" }
      - name: run tests
        run: ./mvnw test
